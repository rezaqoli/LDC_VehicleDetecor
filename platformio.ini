; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:custom_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
lib_deps = 
	pilotak/MovingAverage
	khoih-prog/WebSockets_Generic
	pangodream/ESP2SOTA@^1.0.2
	stevemarple/SoftWire@^2.0.10
	vshymanskyy/TinyGSM@^0.12.0
	knolleary/PubSubClient@^2.8
lib_ignore = 
	WiFiEspAT
	UIPEthernet
	EthernetENC
	WiFi101
	WiFi101_Generic
	WiFiNINA_Generic
	DueFlashStorage
	SinricPro_Generic
build_flags =
	-D CORE_DEBUG_LEVEL=3
	-D CONFIG_FREERTOS_HZ=1000
	-D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
	-Wno-unused-variable
	-I include
build_src_filter = 
	+<*>
	-<EC200U_LTE.cpp>
	-<EC200U_Integration_Example.cpp>
	-<hal/hal_native.cpp>
	-<test_stubs.cpp>
extra_scripts =
	pre:scripts/patch_tinygsm_qird.py

; EC200U AT commands over the ESP32-S3 native USB-OTG port.  Because this
; consumes the native USB PHY in host mode, use UART0/a USB-UART bridge for
; Serial diagnostics with this environment.
[env:custom_esp32s3_usb_modem]
extends = env:custom_esp32s3
build_flags =
	${env:custom_esp32s3.build_flags}
	-D MODEM_TRANSPORT=2

; Native test env — only compiled for `pio test -e native`. Has its own
; build_src_filter; explicitly does NOT match `pio run`.
; [env:native]
; platform = native
; build_flags = -std=gnu++17 -I include -Itest/shims -DARDUINO_NATIVE -D_GNU_SOURCE
; build_src_filter = +<*> -<EC200U_LTE.cpp> -<EC200U_Integration_Example.cpp> -<hal/hal_esp32.cpp> -<ReplyChannel.cpp> -<main.cpp> -<Tasks.cpp> -<LteModem.cpp> -<MqttHandler.cpp> -<WsCommandHandler.cpp> -<WsUtils.cpp> -<SensorDriver.cpp> -<PowerMonitor.cpp> -<TimeManager.cpp> -<SmsManager.cpp> -<PersistentConfig.cpp> -<dashboard_*.h>
; test_filter = test_host_*
; test_build_src = yes
; extra_scripts = scripts/use_msys2_gcc.py

; ; ESP32-S3 HW test env — only compiled for `pio test -e esp32s3_hw`.
; [env:esp32s3_hw]
; extends = env:custom_esp32s3
; test_filter = test_hw_*
